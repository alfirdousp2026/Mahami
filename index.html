<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2a24;--mute:#6b766f;--accent:#1f6b4f;--line:#ddd5c3;--done:#e4efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231d;--ink:#e8efe9;--mute:#93a39a;--accent:#5fc79a;--line:#2a3a31;--done:#1f3328}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231d;--ink:#e8efe9;--mute:#93a39a;--accent:#5fc79a;--line:#2a3a31;--done:#1f3328}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri",Tahoma,sans-serif;font-size:18px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:25px;margin:4px 0 0}
h2{font-size:18px;margin:16px 0 6px;color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mute{color:var(--mute);font-size:14px}
.tabs,.days{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.tabs button,.days button,.btn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 14px;font:inherit;font-size:16px;text-decoration:none;cursor:pointer}
.tabs button.on,.days button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn{border-radius:10px;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.hl{border:2px solid var(--accent)}
.big{font-size:24px;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:7px;cursor:pointer;user-select:none}
.row.done{background:var(--done);color:var(--mute)}
.row.done .t{text-decoration:line-through}
.row .t{flex:1}
.box{width:26px;height:26px;flex:0 0 26px;border:2px solid var(--accent);border-radius:7px;display:grid;place-items:center;color:var(--bg);font-size:17px}
.row.done .box{background:var(--accent)}
.cnt{border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:16px}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin:8px 0}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute)}
.chart i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:3px 0}
.f{display:flex;gap:6px;align-items:center}
.f input{flex:1}
.f select{width:auto}
.x{border:0;background:none;color:#c0392b;font-size:20px;cursor:pointer}
.bd{display:inline-block;margin:4px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;opacity:.45}.bd.on{opacity:1;border-color:var(--accent);color:var(--accent);font-weight:700}
</style>
</head>
